name: Live Maps E2E (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Run two low-volume public Google Maps checks (place search + transit route)"
        required: true
        type: choice
        options:
          - run-live-check

permissions:
  contents: read

concurrency:
  group: live-maps-e2e
  cancel-in-progress: false

jobs:
  live-maps:
    if: ${{ inputs.confirm == 'run-live-check' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run bounded live Maps E2E
        run: node scripts/live-maps-e2e.mjs
