name: Live Maps E2E (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Run bounded public Google Maps checks"
        required: true
        type: choice
        options:
          - run-live-check
      runtime:
        description: "Execution environment for the bounded live check"
        required: true
        default: host
        type: choice
        options:
          - host
          - container
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-maps-e2e
  cancel-in-progress: false

jobs:
  live-maps:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'run-live-check') ||
        (github.event_name == 'pull_request' && github.head_ref == 'feat/v4-place-photos')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ github.event_name == 'pull_request' || inputs.runtime == 'host' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name == 'pull_request' || inputs.runtime == 'host' }}
        run: npm ci --ignore-scripts

      - name: Build host runtime
        if: ${{ github.event_name == 'pull_request' || inputs.runtime == 'host' }}
        run: npm run build

      - name: Run bounded live Maps E2E on host
        if: ${{ github.event_name == 'pull_request' || inputs.runtime == 'host' }}
        run: node scripts/live-maps-e2e.mjs

      - name: Build container image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime == 'container' }}
        run: docker build --tag maps-browser-mcp:live .

      - name: Run bounded live Maps E2E in sandbox-capable container
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime == 'container' }}
        run: >-
          docker run --rm
          --cap-add=SYS_ADMIN
          --mount type=bind,source="${{ github.workspace }}/scripts/live-maps-e2e.mjs",target=/app/scripts/live-maps-e2e.mjs,readonly
          maps-browser-mcp:live
          node scripts/live-maps-e2e.mjs
