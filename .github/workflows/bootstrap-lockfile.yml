name: Bootstrap lockfile

on:
  push:
    branches: [audit-hardening-v3]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit-hardening-v3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate and commit package-lock.json
        run: |
          if [ -f package-lock.json ]; then
            echo 'package-lock.json already exists'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: add npm lockfile'
          git push origin HEAD:audit-hardening-v3
