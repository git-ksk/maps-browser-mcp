name: Repair Native Test Env

on:
  pull_request:
    paths:
      - .github/workflows/repair-native-test-env.yml

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/hosted-human-surface'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Add Native takeover variables to isolated config test environment
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/config.test.ts")
          text = path.read_text()
          anchor = '  "MAPS_CUA_DRIVER_COMMAND",\n'
          addition = '''  "MAPS_CUA_DRIVER_COMMAND",\n  "MAPS_NATIVE_TAKEOVER_ADVERTISED_HOST",\n  "MAPS_NATIVE_TAKEOVER_INPUT_BIND_HOST",\n  "MAPS_NATIVE_TAKEOVER_FEEDBACK_BIND_HOST",\n  "MAPS_NATIVE_TAKEOVER_CONTROL_BIND_HOST",\n  "MAPS_NATIVE_TAKEOVER_INPUT_PORT",\n  "MAPS_NATIVE_TAKEOVER_CONTROL_PORT",\n  "MAPS_NATIVE_TAKEOVER_VIDEO_FEEDBACK_PORT",\n  "MAPS_NATIVE_TAKEOVER_DISPLAY_ID",\n  "MAPS_NATIVE_TAKEOVER_HOST_EXECUTABLE",\n  "MAPS_NATIVE_TAKEOVER_REVOKE_EXECUTABLE",\n'''
          if text.count(anchor) != 1:
              raise SystemExit("config test key anchor changed")
          text = text.replace(anchor, addition, 1)
          path.write_text(text)
      - name: Commit test environment fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/config.test.ts
          git commit -m "test(config): isolate native takeover environment"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
