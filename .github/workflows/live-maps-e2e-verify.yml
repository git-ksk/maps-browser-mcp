name: Live Maps E2E verification

on:
  push:
    branches: [verify-live-maps-e2e]

permissions:
  contents: read

concurrency:
  group: live-maps-e2e-verification
  cancel-in-progress: true

jobs:
  live-maps:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run bounded live Maps E2E
        run: node scripts/live-maps-e2e.mjs
