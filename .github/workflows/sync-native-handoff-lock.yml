name: Sync Native Handoff Lock

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/sync-native-handoff-lock.yml

permissions:
  contents: read

jobs:
  sync-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/hosted-human-surface'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lock if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh handoff dependency lock"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
