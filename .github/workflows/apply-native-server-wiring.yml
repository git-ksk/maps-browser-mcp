name: Apply Native Server Wiring

on:
  pull_request:
    paths:
      - .github/workflows/apply-native-server-wiring.yml

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/hosted-human-surface'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair native server integration
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/server.ts")
          text = path.read_text()

          bad = "config.config.credentialSafeHandoff"
          count = text.count(bad)
          if count != 4:
              raise SystemExit(f"expected 4 duplicated config anchors, found {count}")
          text = text.replace(bad, "config.credentialSafeHandoff")

          old_shutdown = "await credentialSafeCuaAdapter.close().catch(() => undefined);"
          if text.count(old_shutdown) != 1:
              raise SystemExit("CUA shutdown anchor changed")
          text = text.replace(
              old_shutdown,
              "await credentialSafeCuaAdapter?.close().catch(() => undefined);",
              1,
          )

          path.write_text(text)
      - name: Commit repaired server wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts
          git commit -m "fix(takeover): repair native Maps wiring"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
