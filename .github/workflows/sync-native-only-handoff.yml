name: Sync Native-only Handoff Pin

on:
  pull_request:
    paths:
      - .github/workflows/sync-native-only-handoff.yml

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/hosted-human-surface'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile from immutable Handoff pin
        run: npm install --package-lock-only --ignore-scripts
      - name: Update immutable-pin policy expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/repository-policy.test.ts")
          text = path.read_text()
          old = "d9afc2c2a3e691657f66d394a6b21d78ec883a0a"
          new = "7f9de42579656a9e8809667140e44635bcfda1b2"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one old Handoff policy pin, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Commit lock and policy pin
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json tests/repository-policy.test.ts
          git commit -m "chore(takeover): sync Native-only Handoff lock"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
