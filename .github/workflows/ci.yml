name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - name: Emit generated lockfile once for repository bootstrap
        if: matrix.node == 22
        run: |
          printf 'LOCKFILE_BASE64='
          base64 -w0 package-lock.json
          printf '\n'
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run build
      - name: HTTP/MCP smoke test
        if: matrix.node == 22
        run: npm run smoke:http
      - name: Chrome/CDP smoke test (no Google Maps access)
        if: matrix.node == 22
        run: npm run smoke:browser
      - name: Package dry run
        if: matrix.node == 22
        run: npm pack --dry-run
