name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run build
      - name: stdio MCP smoke test
        if: matrix.node == 22
        run: npm run smoke:stdio
      - name: HTTP/MCP smoke test
        if: matrix.node == 22
        run: npm run smoke:http
      - name: Chrome/CDP smoke test (no Google Maps access)
        if: matrix.node == 22
        run: npm run smoke:browser
      - name: Package dry run
        if: matrix.node == 22
        run: npm pack --dry-run

  platform-browser:
    name: Browser smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Chrome/CDP smoke test (no Google Maps access)
        run: npm run smoke:browser
