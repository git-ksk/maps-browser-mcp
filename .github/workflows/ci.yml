name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run build
      - name: stdio MCP smoke test
        if: matrix.node == 22
        run: npm run smoke:stdio
      - name: HTTP/MCP smoke test
        if: matrix.node == 22
        run: npm run smoke:http
      - name: Chrome/CDP smoke test (no Google Maps access)
        if: matrix.node == 22
        run: npm run smoke:browser
      - name: Package dry run
        if: matrix.node == 22
        run: npm pack --dry-run

  platform-browser:
    name: Browser smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Chrome/CDP smoke test (no Google Maps access)
        run: npm run smoke:browser

  container:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container image
        run: docker build --tag maps-browser-mcp:ci .
      - name: Verify unsandboxed Chromium is not enabled by the image
        run: >-
          docker run --rm --entrypoint sh maps-browser-mcp:ci
          -lc 'test -z "${MAPS_ALLOW_UNSANDBOXED_CHROMIUM:-}"'
      - name: Chrome/CDP smoke inside restricted container runtime
        run: >-
          docker run --rm
          -e MAPS_ALLOW_UNSANDBOXED_CHROMIUM=true
          --entrypoint node
          maps-browser-mcp:ci
          scripts/smoke-browser.mjs
      - name: HTTP liveness and PORT fallback inside container
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f maps-browser-mcp-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --rm \
            --name maps-browser-mcp-ci \
            -p 127.0.0.1:8790:8790 \
            -e PORT=8790 \
            -e MCP_HTTP_HOST=0.0.0.0 \
            -e MCP_ALLOW_NONLOOPBACK=true \
            -e MCP_BEARER_TOKEN=0123456789abcdefghijklmnopqrstuv \
            maps-browser-mcp:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8790/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs maps-browser-mcp-ci || true
          exit 1
