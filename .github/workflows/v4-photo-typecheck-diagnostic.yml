name: V4 Photo Test Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.head_ref == 'feat/v4-place-photos' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run tests with annotations
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure="$(grep -n -B 12 -A 32 '^not ok ' /tmp/test.log | head -n 48 | tr '\n' ' ' | cut -c1-5000)"
            echo "::error title=V4 photo test failure::$failure"
          fi
          exit "$status"
